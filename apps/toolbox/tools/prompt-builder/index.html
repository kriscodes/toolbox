<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Turn an idea into a reusable prompt with your project context." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>try { if (localStorage.getItem('toolbox.theme.v1') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* Keep the light default. */ }</script>
    <title>Prompt Builder — Toolbox</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Please enable JavaScript to use the Prompt Builder.</noscript>
    <script type="module" src="/src/prompt-builder.ts"></script>
  </body>
</html>

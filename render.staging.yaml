# Prepared for review only. Importing this Blueprint creates and deploys resources.
# Activate only after reviewing docs/STAGING.md. No production resources are defined here.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: "off"
projects:
  - name: Toolbox Staging
    environments:
      - name: staging
        services:
          - type: web
            name: kristian-toolbox-staging
            runtime: static
            repo: https://github.com/kriscodes/toolbox
            branch: staging
            buildCommand: npm ci && npm run build
            staticPublishPath: dist
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/toolbox/**
                - tools/**
                - packages/**
                - scripts/**
                - package.json
                - package-lock.json
                - .node-version
                - .npmrc
                - tsconfig*.json
                - render.staging.yaml
            domains:
              - toolbox.staging.kristiansalmeron.com
            envVars:
              - key: NODE_VERSION
                value: 22.23.4
              - key: SKIP_INSTALL_DEPS
                value: "true"
              - key: VITE_PROMPT_API_URL
                value: https://toolbox-prompt-api-staging.onrender.com
              - key: VITE_ANALYTICS_ORIGIN
                value: https://analytics.staging.kristiansalmeron.com
            headers:
              - path: /*
                name: X-Robots-Tag
                value: noindex, nofollow, noarchive
          - type: web
            name: toolbox-prompt-api-staging
            runtime: node
            repo: https://github.com/kriscodes/toolbox
            branch: staging
            plan: free
            region: virginia
            buildCommand: npm ci && npm run check
            startCommand: npm run start:api
            healthCheckPath: /api/health
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/prompt-api/**
                - packages/**
                - package.json
                - package-lock.json
                - .node-version
                - .npmrc
                - tsconfig*.json
                - render.staging.yaml
            envVars:
              - key: OPENAI_API_KEY
                sync: false
              - key: NODE_VERSION
                value: 22.23.4
              - key: SKIP_INSTALL_DEPS
                value: "true"
              - key: ALLOWED_ORIGINS
                value: https://toolbox.staging.kristiansalmeron.com
              - key: PROMPT_BUILDER_ACCESS_KEY
                generateValue: true
